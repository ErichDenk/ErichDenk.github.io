<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Erich Denk</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Erich Denk</a>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="cv.html">CV</a></li>
                <li><a href="writing.html">Writing</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><button class="theme-toggle" type="button" aria-label="Toggle dark mode">Dark mode</button></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section>
            <h1 class="fade-in">Contact</h1>
            <p class="subtitle fade-in-delay">Get in touch</p>

            <div class="contact-info fade-in-delay-2">
                <div class="contact-item">
                    <h3>Email</h3>
                    <p><a href="mailto:edenk17.ed@gmail.com">edenk17.ed@gmail.com</a></p>
                </div>

                <div class="contact-item">
                    <h3>LinkedIn</h3>
                    <p><a href="https://www.linkedin.com/in/erich-denk-619451a8/" target="_blank">linkedin.com/in/erich-denk-619451a8</a></p>
                </div>

                <div class="contact-item">
                    <h3>GitHub</h3>
                    <p><a href="https://github.com/erichdenk" target="_blank">github.com/erichdenk</a></p>
                </div>

                <div class="contact-item">
                    <h3>Location</h3>
                    <p>Greater Boston, MA, USA</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Erich Denk. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        (function(){
            const k='theme', root=document.documentElement, mq=window.matchMedia('(prefers-color-scheme: dark)');
            const get=()=>localStorage.getItem(k)|| (mq.matches?'dark':'light');
            const apply=t=>{ t==='dark'?root.setAttribute('data-theme','dark'):root.removeAttribute('data-theme'); localStorage.setItem(k,t); upd(); };
            const upd=()=>{ const b=document.querySelector('.theme-toggle'); if(!b) return; const t=get(); b.setAttribute('aria-pressed', t==='dark'); b.textContent=t==='dark'?'Light mode':'Dark mode'; };
            document.addEventListener('click',e=>{ if(e.target&&e.target.classList.contains('theme-toggle')) apply(get()==='dark'?'light':'dark'); });
            mq.addEventListener('change',e=>{ if(!localStorage.getItem(k)) apply(e.matches?'dark':'light');});
            apply(get());
        })();
    </script>
</body>
</html>
