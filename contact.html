<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Your Name</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Your Name</a>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="cv.html">CV</a></li>
                <li><a href="writing.html">Writing</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section>
            <h1 class="fade-in">Contact</h1>
            <p class="subtitle fade-in-delay">Get in touch</p>

            <div class="contact-info fade-in-delay-2">
                <div class="contact-item">
                    <h3>Email</h3>
                    <p><a href="mailto:your.email@example.com">your.email@example.com</a></p>
                </div>

                <div class="contact-item">
                    <h3>LinkedIn</h3>
                    <p><a href="https://linkedin.com/in/yourprofile" target="_blank">linkedin.com/in/yourprofile</a></p>
                </div>

                <div class="contact-item">
                    <h3>GitHub</h3>
                    <p><a href="https://github.com/yourusername" target="_blank">github.com/yourusername</a></p>
                </div>

                <div class="contact-item">
                    <h3>Twitter / X</h3>
                    <p><a href="https://twitter.com/yourhandle" target="_blank">@yourhandle</a></p>
                </div>

                <div class="contact-item">
                    <h3>Location</h3>
                    <p>City, State/Country</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Your Name. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
